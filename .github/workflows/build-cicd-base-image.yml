name: Build Container Image
run-name: ${{ github.actor }} initiated ${{ github.event.inputs.target-project }} image build 🚀

on:
  workflow_dispatch:
    inputs:
      target-project:
        description: "Project/image key to build"
        required: true
        type: choice
        options:
          - fetcher
          - data-pipeline

env:
  IMAGE_RETENTION_COUNT: ${{ vars.CICD_IMAGE_RETENTION_COUNT || '5' }}
  PROJECT_CONFIGS: >-
    {
      "fetcher": {
        "project_name": "bb-fetcher",
        "working_directory": "container-services/fetcher",
        "dockerfile": "docker/ci.Dockerfile",
        "docker_target": ""
      },
      "data-pipeline": {
        "project_name": "bb-data-pipeline",
        "working_directory": "spark-applications/data-pipeline",
        "dockerfile": "docker/ci.Dockerfile",
        "docker_target": ""
      }
    }

jobs:
  Build-Container-Image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code 📂
        uses: actions/checkout@v4

      - name: Resolve project configuration 🧭
        id: resolve-config
        env:
          TARGET_PROJECT: ${{ github.event.inputs.target-project }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          target_project = os.environ["TARGET_PROJECT"]
          project_configs = json.loads(os.environ["PROJECT_CONFIGS"])
          config = project_configs.get(target_project)

          if config is None:
              print(f"Unsupported target project: {target_project}", file=sys.stderr)
              sys.exit(1)

          config["image_name"] = f"{config['project_name']}-ci"

          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as output_file:
              output_file.write(f"target_project={target_project}\n")
              for key, value in config.items():
                  output_file.write(f"{key}={value}\n")
          PY

      - name: Login via Azure CLI 🔑
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Docker Login 🐳
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.REGISTRY_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Docker Image 🐳
        working-directory: ${{ steps.resolve-config.outputs.working_directory }}
        env:
          IMAGE_NAME: ${{ steps.resolve-config.outputs.image_name }}
          DOCKERFILE_PATH: ${{ steps.resolve-config.outputs.dockerfile }}
          DOCKER_TARGET: ${{ steps.resolve-config.outputs.docker_target }}
        shell: bash
        run: |
          DOCKER_BUILD_ARGS=(
            --no-cache
            --tag "${{ secrets.REGISTRY_SERVER }}/${IMAGE_NAME}:latest"
            --tag "${{ secrets.REGISTRY_SERVER }}/${IMAGE_NAME}:${{ github.sha }}"
            --file "${DOCKERFILE_PATH}"
          )

          if [ -n "${DOCKER_TARGET}" ]; then
            DOCKER_BUILD_ARGS+=(--target "${DOCKER_TARGET}")
          fi

          docker build "${DOCKER_BUILD_ARGS[@]}" .

      - name: Push Docker Image 📤
        env:
          IMAGE_NAME: ${{ steps.resolve-config.outputs.image_name }}
        run: |
          docker push "${{ secrets.REGISTRY_SERVER }}/${IMAGE_NAME}:${{ github.sha }}"
          docker push "${{ secrets.REGISTRY_SERVER }}/${IMAGE_NAME}:latest"

      - name: Prune Old Docker Images 🧹
        env:
          IMAGE_NAME: ${{ steps.resolve-config.outputs.image_name }}
          REGISTRY_SERVER: ${{ secrets.REGISTRY_SERVER }}
          IMAGE_RETENTION_COUNT: ${{ env.IMAGE_RETENTION_COUNT }}
        shell: bash
        run: |
          REGISTRY_NAME="${REGISTRY_SERVER%%.*}"

          mapfile -t OLD_DIGESTS < <(
            az acr manifest list-metadata \
              --name "${IMAGE_NAME}" \
              --registry "${REGISTRY_NAME}" \
              --orderby time_desc \
              --query "[${IMAGE_RETENTION_COUNT}:].digest" \
              --output tsv
          )

          if [ "${#OLD_DIGESTS[@]}" -eq 0 ]; then
            echo "No old images to prune for ${IMAGE_NAME}. Retention count: ${IMAGE_RETENTION_COUNT}."
            exit 0
          fi

          for digest in "${OLD_DIGESTS[@]}"; do
            if [ -n "${digest}" ]; then
              echo "Deleting ${IMAGE_NAME}@${digest}"
              az acr repository delete \
                --name "${REGISTRY_NAME}" \
                --image "${IMAGE_NAME}@${digest}" \
                --yes
            fi
          done
            